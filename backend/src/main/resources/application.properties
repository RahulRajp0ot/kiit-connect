# =============================================
# KIIT Dating App - Application Configuration
# =============================================

# Server
server.port=8080

# ---- DATABASE (Neon PostgreSQL - Fill in after creating Neon account) ----
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/kiitdating}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:KIITDatingSecretKey2024VeryLongAndSecureKeyForJWT}
app.jwt.expiration=86400000

# ---- CLOUDINARY (Fill in your free Cloudinary credentials) ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ---- CORS (Update with Vercel URL after frontend deployment) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---- College Domain ----
app.college.domain=kiit.ac.in

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.kiit.dating=INFO
logging.level.org.springframework.security=WARN
