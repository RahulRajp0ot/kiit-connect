# =============================================
# KIIT Dating App - Application Configuration
# =============================================

# Server (uses 8088 to avoid conflicts with Oracle on port 8080)
server.port=${PORT:8088}

# ---- DATABASE (Defaults to H2 for local testing; use Neon PostgreSQL in production) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:kiitdating;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
# Driver class name is auto-detected by Spring Boot from URL (H2 for local, org.postgresql.Driver for Neon/Supabase)
# spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate (Dialect auto-detected by Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console for local inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:KIITDatingSecretKey2024VeryLongAndSecureKeyForJWT}
app.jwt.expiration=86400000

# ---- CLOUDINARY (Fill in your free Cloudinary credentials) ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}

# ---- CORS (Update with Vercel URL after frontend deployment) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGIN:*}}

# ---- College Domain ----
app.college.domain=kiit.ac.in

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Logging
logging.level.com.kiit.dating=INFO
logging.level.org.springframework.security=WARN

# ---- Free SMTP / Gmail Configuration (Port 465 SMTPS for Cloud Compatibility) ----
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME:rahulrajp0ot77799@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:rgcztvxskcswmuat}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=*
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

